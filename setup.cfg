    marker = sys_platform == "linux" and platform_machine == "arm64"
    url = https://github.com/chipsalliance/verible/releases/download/v0.0-4298-g085eef05/verible-v0.0-4298-g085eef05-linux-static-arm64.tar.gz
    sha256 = b0c9367535d61ce8d5f021c6d434bef9c774692bbd751bd86d16602c57afbe9c
    extract = tar
    extract_path = verible-v0.0-4298-g085eef05/bin/verible-verilog-format
    [verible-verilog-format.exe]
