    sha256 = e4a70e9920b6a24ce35045d4c9457d7d9185efc3c534a35ff55ef0262578b4e0
    extract = tar
    extract_path = verible-v0.0-4296-g0f262651/bin/verible-verilog-format
    [verible-verilog-format.exe]
