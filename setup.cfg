    marker = sys_platform == "win32" and platform_machine == "AMD64"
    marker = sys_platform == "cygwin" and platform_machine == "x86_64"
    url = https://github.com/chipsalliance/verible/releases/download/v0.0-4157-gfdbac312/verible-v0.0-4157-gfdbac312-win64.zip
    sha256 = 586679435c3bbb851c48c68de136d8d231bbc93be114467feb3c0d1c60b69bfc
    extract = zip
    extract_path = verible-v0.0-4157-gfdbac312-win64/verible-verilog-format.exe
