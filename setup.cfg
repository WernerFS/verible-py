    group = verible-verilog-format
    marker = sys_platform == "linux" and platform_machine == "x86_64"
    url = https://github.com/chipsalliance/verible/releases/download/v0.0-4157-gfdbac312/verible-v0.0-4157-gfdbac312-linux-static-x86_64.tar.gz
    sha256 = 9e7ead54bc5efcc31476eb87dd970fe51314e8ca6bd00e0646e1ea6cde137448
    extract = tar
    extract_path = verible-v0.0-4157-gfdbac312/bin/verible-verilog-format
    [verible-verilog-format]
    group = verible-verilog-format
    marker = sys_platform == "linux" and platform_machine == "arm64"
    url = https://github.com/chipsalliance/verible/releases/download/v0.0-4157-gfdbac312/verible-v0.0-4157-gfdbac312-linux-static-arm64.tar.gz
    sha256 = e87ac5918115dc17e68bec8f32ed01901bfaeffb41c29daf5743bbd8d271d3a0
    extract = tar
    extract_path = verible-v0.0-4157-gfdbac312/bin/verible-verilog-format
    [verible-verilog-format.exe]
